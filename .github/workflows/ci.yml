name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The fare store is Postgres, so the tests that touch it need a real one.
    # A throwaway container is what keeps them from being pointed at Neon: the
    # fixtures truncate the fare table between tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the test step can start before Postgres accepts
        # connections, which fails the run for no reason anyone can act on.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # This is the same script Render runs as its Build Command, so a change
      # that would break the deploy fails here first, on the pull request,
      # rather than at start-up after it has already shipped. It installs the
      # dependencies and asserts main.py imports with its routes registered.
      #
      # No GROQ_API_KEY secret is needed: the script falls back to a
      # placeholder, and nothing here makes a network call.
      - name: Render build script (deps + import check)
        run: bash backend/build.sh

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      # GitHub sets CI=true, which conftest.py reads: if TEST_DATABASE_URL were
      # ever missing here, the database tests fail the run rather than skipping
      # themselves and leaving a green tick over untested code.
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build runs TypeScript itself, so this covers the typecheck as
      # well. A standalone `tsc --noEmit` would have to come after this step
      # regardless: it needs next-env.d.ts, which is gitignored and generated
      # by the build.
      - name: Build
        run: npm run build
