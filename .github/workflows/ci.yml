name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # This is the same script Render runs as its Build Command, so a change
      # that would break the deploy fails here first, on the pull request,
      # rather than at start-up after it has already shipped. It installs the
      # dependencies and asserts main.py imports with its routes registered.
      #
      # No GROQ_API_KEY secret is needed: the script falls back to a
      # placeholder, and nothing here makes a network call.
      - name: Render build script (deps + import check)
        run: bash backend/build.sh

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v
